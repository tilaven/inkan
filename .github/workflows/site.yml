name: Site

# Builds the documentation site and publishes main to https://useinkan.dev (Cloudflare Workers static assets).
# Needs the repository secrets CLOUDFLARE_API_TOKEN ("Edit Cloudflare Workers" template, scoped to the
# account and the useinkan.dev zone) and CLOUDFLARE_ACCOUNT_ID. Pull requests only validate the upload.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for "Last updated"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - name: Validate the upload
        if: github.event_name == 'pull_request'
        working-directory: docs
        run: npx --yes wrangler@4.151.2 deploy --dry-run
      - name: Deploy
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: docs
        run: npx --yes wrangler@4.151.2 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
